<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-2xl mx-auto w-full p-4 sm:p-6 lg:p-8 my-auto">
        
        <!-- HEADER -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-3 shadow-xs">
                <i data-lucide="volume-2" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Spelling Practice</h1>
            <p class="text-slate-500 text-sm mt-1">Select the most common IELTS vocabulary topics or paste your custom list to practice.</p>
        </header>

        <!-- SETUP SECTION -->
        <div id="setup-section" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all duration-300">
            
            <!-- Tab Switcher -->
            <div class="flex p-1 bg-slate-100 rounded-xl mb-5">
                <button 
                    id="tab-topics-btn"
                    onclick="switchTab('topics')"
                    class="flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-xs"
                >
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    Topics & Vocab Lists
                </button>
                <button 
                    id="tab-custom-btn"
                    onclick="switchTab('custom')"
                    class="flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900"
                >
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    Custom Word List
                </button>
            </div>

            <!-- TAB CONTENT: TOPICS -->
            <div id="tab-topics" class="space-y-4">
                <div class="flex items-center justify-between">
                    <label class="block font-semibold text-slate-700 text-sm">
                        Choose Topics to Practice:
                    </label>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="selectAllTopics(true)" class="text-xs text-indigo-600 hover:underline font-medium">Select All</button>
                        <span class="text-slate-300 text-xs">|</span>
                        <button type="button" onclick="selectAllTopics(false)" class="text-xs text-slate-500 hover:underline font-medium">Clear</button>
                    </div>
                </div>

                <!-- Topic Checkboxes Container -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-1" id="topic-checkboxes">
                    <!-- Dynamic Topic Checkboxes will populate here -->
                </div>

                <!-- Show More / Less Topics Toggle Button -->
                <div class="text-center pt-1">
                    <button 
                        type="button" 
                        id="toggle-topics-btn" 
                        onclick="toggleMoreTopics()" 
                        class="inline-flex items-center justify-center gap-1.5 py-2 px-4 bg-slate-100 hover:bg-slate-200 text-indigo-600 hover:text-indigo-700 font-semibold text-xs rounded-xl transition cursor-pointer"
                    >
                        <span id="toggle-topics-text">+ Show More Topics</span>
                        <i id="toggle-topics-icon" data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- TAB CONTENT: CUSTOM PASTE -->
            <div id="tab-custom" class="hidden space-y-3">
                <label for="word-input" class="block font-semibold text-slate-700 text-sm">
                    Paste Custom Word List:
                </label>
                <textarea 
                    id="word-input" 
                    rows="5" 
                    class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-800 placeholder-slate-400 text-sm"
                    placeholder="example&#10;accommodate&#10;rhythm&#10;definitely"
                ></textarea>
            </div>

            <!-- Practice Options -->
            <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
                <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                    <input type="checkbox" id="shuffle-words" checked class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span>Shuffle / Randomize Word Order</span>
                </label>
            </div>

            <!-- Voice selection & settings options -->
            <div class="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-200/70 space-y-3">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <label for="voice-select" class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="mic" class="w-4 h-4 text-indigo-500"></i>
                        Voice Selection:
                    </label>
                    <select id="voice-select" class="text-xs border border-slate-300 rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium max-w-full sm:max-w-xs text-slate-700">
                        <option value="">Loading voices...</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                    <div>
                        <label for="voice-speed" class="text-xs font-medium text-slate-600 block mb-1">Speed Rate:</label>
                        <select id="voice-speed" class="w-full text-xs border border-slate-300 rounded-lg p-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="0.75">Slow (0.75x)</option>
                            <option value="0.9">Natural (0.9x)</option>
                            <option value="1" selected>Normal (1.0x)</option>
                            <option value="1.2">Fast (1.2x)</option>
                        </select>
                    </div>

                    <div>
                        <label for="audio-engine" class="text-xs font-medium text-slate-600 block mb-1">Audio Source:</label>
                        <select id="audio-engine" class="w-full text-xs border border-slate-300 rounded-lg p-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="speech-synth" selected>Speech Voice API</option>
                            <option value="online-audio">Online Audio (Dictionary)</option>
                        </select>
                    </div>

                    <div class="flex items-end">
                        <button 
                            type="button" 
                            onclick="testVoice()" 
                            class="w-full py-1.5 px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-xs transition flex items-center justify-center gap-1.5"
                        >
                            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                            Test Voice
                        </button>
                    </div>
                </div>
            </div>

            <button 
                id="start-btn" 
                onclick="startPractice()" 
                class="mt-6 w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-xl shadow-md shadow-indigo-100 hover:shadow-indigo-200 transition flex items-center justify-center gap-2"
            >
                <span>Start Practice</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- PRACTICE SECTION -->
        <div id="practice-section" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                <span id="word-count-badge" class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                    0 Words
                </span>
                <button 
                    onclick="resetApp()" 
                    class="text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1 transition font-medium"
                >
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    Change Topics / Words
                </button>
            </div>

            <div id="fields-container" class="space-y-4">
                <!-- Dynamically generated fields will go here -->
            </div>

            <button 
                id="check-btn" 
                onclick="checkAnswers()" 
                class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium rounded-xl shadow-md shadow-emerald-100 transition flex items-center justify-center gap-2"
            >
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span>Check Answers</span>
            </button>
        </div>

        <!-- RESULTS CARD -->
        <div id="results-card" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 text-center space-y-4">
            <div id="score-icon" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center">
                <!-- Dynamic icon -->
            </div>
            <div>
                <h2 id="score-title" class="text-2xl font-bold text-slate-900">Result Title</h2>
                <p id="score-text" class="text-slate-600 text-sm mt-1">You scored 0 out of 0</p>
            </div>
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button 
                    id="retry-mistakes-btn"
                    onclick="retryMistakesOnly()" 
                    class="hidden flex-1 py-3 px-4 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm"
                >
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    Retry Mistakes Only
                </button>
                <button 
                    onclick="retrySameWords()" 
                    class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm"
                >
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    Retry All
                </button>
                <button 
                    onclick="resetApp()" 
                    class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm"
                >
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    New Session
                </button>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-slate-400 text-xs">
        Spelling Practice App &bull; Native Audio & Multi-Topic Support
    </footer>

    <script>
        // Topic Categories Dictionary with all requested vocabulary lists
        const TOPICS_DATA = {
            "Days of the week": [
                "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
            ],
            "Months and seasons": [
                "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December", "winter", "spring", "autumn", "summer"
            ],
            "Shapes": [
                "circle", "square", "rectangle", "triangle", "cylinder", "oval"
            ],
            "Transportation": [
                "Automobile", "truck", "tractor", "tram", "subway", "airplane", "train", "bicycle", "car", "pedestrian", "passenger", "commuter"
            ],
            "Colours": [
                "Red", "orange", "yellow", "green", "blue", "purple", "white", "black", "brown"
            ],
            "Verbs": [
                "Suggest", "develop", "borrow", "persuade", "discuss", "review", "concentrate", "believe", "crash"
            ],
            "Adjectives": [
                "Beautiful", "necessary", "fantastic", "comfortable", "convenient", "wonderful", "terrible", "temporary", "permanent", "knowledgeable", "exciting", "boring", "difficult", "easy"
            ],
            "Rooms in buildings": [
                "Kitchen", "bathroom", "bedroom", "living room", "dining room", "lounge", "library", "gymnasium", "cafeteria", "classroom", "waiting room", "reception", "ticket desk", "storage room", "theatre"
            ],
            "Place markers": [
                "Street", "road", "avenue", "lane", "drive", "court", "place", "terrace", "way"
            ],
            "Directions & Prepositions": [
                "North", "south", "east", "west", "up", "down", "right", "left", "straight", "across from", "between", "besides", "diagonal", "corner", "opposite", "adjacent to", "near", "past", "before", "after"
            ],
            "Verbs (Directions)": [
                "Turn", "move", "continue on", "walk", "cross", "pass", "start", "finish", "end", "stop", "go straight ahead"
            ],
            "Places on a map": [
                "Tennis court", "river", "courtyard", "laboratory", "building", "bridge", "road", "path", "traffic lights", "bench", "seat", "table", "basketball court", "running track", "swimming pool", "beach", "forest", "garden", "castle"
            ],
            "Academic terminology": [
                "Presentation", "project", "teamwork", "pairs", "organisation", "outline", "proofreading", "experiment", "reference", "lecture", "tutor", "instructor", "attendance", "specialist", "knowledge", "faculty", "bachelor’s", "master's", "schedule", "management", "leadership", "questionnaire", "statistic", "percentage", "laboratory", "school", "university", "college"
            ],
            "School subjects": [
                "Mathematics", "Science", "English", "Physical Education", "Art", "Music", "Geography", "Biology", "Chemistry", "History"
            ],
            "University disciplines": [
                "Commerce", "Science", "Psychology", "Engineering", "Marketing", "Sociology", "Medicine", "History", "Geography", "Architecture", "Law", "Philosophy", "Economics", "Education"
            ],
            "Examination": [
                "Assessment", "test", "review", "pass", "fail", "retake", "supervise", "supervisor", "evaluate", "exam", "results", "degree", "certificate"
            ]
        };

        let activeTab = 'topics'; // 'topics' | 'custom'
        let targetWords = [];
        let wrongWords = [];
        let availableVoices = [];
        let showAllTopics = false;
        const INITIAL_VISIBLE_TOPICS = 7;
        const synth = window.speechSynthesis;

        // Initialize App on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderTopicCheckboxes();
            populateVoiceList();
            if (synth && synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = populateVoiceList;
            }
        });

        /**
         * Switch Tab between Topics and Custom Input
         */
        function switchTab(tab) {
            activeTab = tab;
            const topicsTab = document.getElementById('tab-topics');
            const customTab = document.getElementById('tab-custom');
            const topicsBtn = document.getElementById('tab-topics-btn');
            const customBtn = document.getElementById('tab-custom-btn');

            if (tab === 'topics') {
                topicsTab.classList.remove('hidden');
                customTab.classList.add('hidden');
                topicsBtn.className = "flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-xs";
                customBtn.className = "flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900";
            } else {
                topicsTab.classList.add('hidden');
                customTab.classList.remove('hidden');
                customBtn.className = "flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-xs";
                topicsBtn.className = "flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900";
            }
        }

        /**
         * Render topic checkboxes dynamically with Expand/Collapse constraint
         */
        function renderTopicCheckboxes() {
            const container = document.getElementById('topic-checkboxes');
            const toggleBtn = document.getElementById('toggle-topics-btn');
            const toggleText = document.getElementById('toggle-topics-text');
            const toggleIcon = document.getElementById('toggle-topics-icon');
            
            container.innerHTML = '';
            const topicKeys = Object.keys(TOPICS_DATA);
            const hiddenCount = topicKeys.length - INITIAL_VISIBLE_TOPICS;

            topicKeys.forEach((topic, index) => {
                const count = TOPICS_DATA[topic].length;
                const label = document.createElement('label');
                
                const isHidden = !showAllTopics && index >= INITIAL_VISIBLE_TOPICS;
                label.className = `flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-200/80 hover:bg-slate-50 cursor-pointer transition select-none text-xs sm:text-sm font-medium text-slate-700 ${isHidden ? 'hidden' : ''}`;
                label.setAttribute('data-topic-index', index);

                label.innerHTML = `
                    <input 
                        type="checkbox" 
                        name="topic-select" 
                        value="${escapeHtml(topic)}" 
                        ${index === 0 ? 'checked' : ''}
                        class="topic-checkbox w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
                    />
                    <span class="flex-1">${escapeHtml(topic)}</span>
                    <span class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full font-normal">${count}</span>
                `;

                container.appendChild(label);
            });

            if (topicKeys.length <= INITIAL_VISIBLE_TOPICS) {
                toggleBtn.classList.add('hidden');
            } else {
                toggleBtn.classList.remove('hidden');
                if (showAllTopics) {
                    toggleText.textContent = `- Show Fewer Topics`;
                    toggleIcon.setAttribute('data-lucide', 'chevron-up');
                } else {
                    toggleText.textContent = `+ Show More Topics (${hiddenCount})`;
                    toggleIcon.setAttribute('data-lucide', 'chevron-down');
                }
                lucide.createIcons();
            }
        }

        /**
         * Toggle showing topics past the 7th item
         */
        function toggleMoreTopics() {
            showAllTopics = !showAllTopics;
            renderTopicCheckboxes();
        }

        function selectAllTopics(shouldSelect) {
            const checkboxes = document.querySelectorAll('.topic-checkbox');
            checkboxes.forEach(cb => cb.checked = shouldSelect);
        }

        /**
         * Load and rank system/browser voices, prioritizing natural & high quality ones
         */
        function populateVoiceList() {
            if (!synth) return;
            
            const rawVoices = synth.getVoices();
            if (!rawVoices || rawVoices.length === 0) return;

            let englishVoices = rawVoices.filter(v => v.lang.startsWith('en'));
            if (englishVoices.length === 0) englishVoices = rawVoices;

            const premiumKeywords = ['natural', 'online', 'google', 'siri', 'premium', 'neural', 'samantha', 'karen', 'daniel', 'alex', 'enhanced'];

            availableVoices = englishVoices.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();

                const scoreA = premiumKeywords.reduce((acc, kw) => nameA.includes(kw) ? acc + 2 : acc, 0) + (a.default ? 1 : 0);
                const scoreB = premiumKeywords.reduce((acc, kw) => nameB.includes(kw) ? acc + 2 : acc, 0) + (b.default ? 1 : 0);

                return scoreB - scoreA;
            });

            const voiceSelect = document.getElementById('voice-select');
            if (!voiceSelect) return;

            voiceSelect.innerHTML = '';

            availableVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                const isNatural = premiumKeywords.some(kw => voice.name.toLowerCase().includes(kw));
                option.textContent = `${voice.name} (${voice.lang})${isNatural ? ' ✨ High Quality' : ''}`;
                voiceSelect.appendChild(option);
            });
        }

        function testVoice() {
            speakWord('Spelling practice initialized successfully');
        }

        /**
         * Pronounce word using Web Speech API or Fallback Audio
         */
        function speakWord(word) {
            if (!word) return;

            const audioEngine = document.getElementById('audio-engine')?.value || 'speech-synth';

            if (audioEngine === 'online-audio') {
                playOnlineAudio(word);
            } else {
                playSpeechSynth(word);
            }
        }

        function playSpeechSynth(word) {
            if (!synth) {
                playOnlineAudio(word);
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(word);
            
            const voiceSelect = document.getElementById('voice-select');
            if (voiceSelect && availableVoices.length > 0) {
                const selectedIndex = parseInt(voiceSelect.value, 10);
                if (!isNaN(selectedIndex) && availableVoices[selectedIndex]) {
                    utterance.voice = availableVoices[selectedIndex];
                }
            }

            const speedSelect = document.getElementById('voice-speed');
            utterance.rate = parseFloat(speedSelect?.value) || 0.9;
            utterance.pitch = 1.0; 

            synth.speak(utterance);
        }

        function playOnlineAudio(word) {
            if (synth) synth.cancel();
            
            const cleanWord = word.trim().toLowerCase().replace(/[^a-z]/g, '');
            if (!cleanWord) return;

            const audioUrl = `https://api.dictionaryapi.dev/media/pronunciations/en/${cleanWord}-us.mp3`;
            const audio = new Audio(audioUrl);

            audio.play().catch(() => {
                playSpeechSynth(word);
            });
        }

        /**
         * Parse custom textarea
         */
        function parseWords(text) {
            return text
                .split(/[\n,]+/)
                .map(w => w.trim())
                .filter(w => w.length > 0);
        }

        /**
         * Utility to shuffle array
         */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /**
         * Transition from setup view to practice view
         */
        function startPractice() {
            let words = [];

            if (activeTab === 'topics') {
                const checkedBoxes = document.querySelectorAll('.topic-checkbox:checked');
                checkedBoxes.forEach(cb => {
                    const topicName = cb.value;
                    if (TOPICS_DATA[topicName]) {
                        words = words.concat(TOPICS_DATA[topicName]);
                    }
                });
            } else {
                const rawText = document.getElementById('word-input').value;
                words = parseWords(rawText);
            }

            if (words.length === 0) {
                alert(activeTab === 'topics' ? 'Please select at least one topic.' : 'Please enter at least one word.');
                return;
            }

            // Check if shuffle is enabled
            const shouldShuffle = document.getElementById('shuffle-words').checked;
            targetWords = shouldShuffle ? shuffleArray(words) : words;

            // Hide setup, show practice
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('practice-section').classList.remove('hidden');
            document.getElementById('results-card').classList.add('hidden');

            renderPracticeFields();
        }

        /**
         * Render practice inputs dynamically
         * Speaker button contains tabindex="-1" so TAB moves directly between input fields
         */
        function renderPracticeFields() {
            const container = document.getElementById('fields-container');
            const countBadge = document.getElementById('word-count-badge');
            
            container.innerHTML = '';
            countBadge.textContent = `${targetWords.length} ${targetWords.length === 1 ? 'Word' : 'Words'}`;

            targetWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs space-y-2 transition";
                card.id = `card-${index}`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-semibold text-slate-400 w-6 text-right">${index + 1}.</span>
                        
                        <div class="relative flex-1">
                            <input 
                                type="text" 
                                id="input-${index}"
                                autocomplete="off"
                                autocorrect="off"
                                autocapitalize="off"
                                spellcheck="false"
                                placeholder="Listen and type spelling..."
                                onfocus="speakWord('${escapeJsString(word)}')"
                                class="w-full py-2.5 pl-3 pr-10 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 text-base transition"
                            />
                        </div>

                        <button 
                            type="button" 
                            tabindex="-1"
                            onclick="speakWord('${escapeJsString(word)}')" 
                            title="Listen Again"
                            class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg border border-slate-200 transition flex items-center justify-center shrink-0 focus:outline-none"
                        >
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div id="feedback-${index}" class="hidden text-xs pl-9 pt-1 font-medium"></div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        /**
         * Evaluate entered spellings against target list
         */
        function checkAnswers() {
            let correctCount = 0;
            wrongWords = [];

            targetWords.forEach((target, index) => {
                const inputEl = document.getElementById(`input-${index}`);
                const feedbackEl = document.getElementById(`feedback-${index}`);
                const cardEl = document.getElementById(`card-${index}`);

                const userVal = inputEl.value.trim();
                const isCorrect = userVal.toLowerCase() === target.toLowerCase();

                feedbackEl.classList.remove('hidden');

                if (isCorrect) {
                    correctCount++;
                    cardEl.className = "bg-emerald-50/50 p-4 rounded-xl border border-emerald-200 shadow-xs space-y-2 transition";
                    inputEl.className = "w-full py-2.5 pl-3 pr-10 border border-emerald-400 bg-white rounded-lg text-emerald-900 font-medium text-base outline-none";
                    feedbackEl.className = "text-xs pl-9 pt-1 font-semibold text-emerald-600 flex items-center gap-1";
                    feedbackEl.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Correct!`;
                } else {
                    wrongWords.push(target);
                    cardEl.className = "bg-rose-50/50 p-4 rounded-xl border border-rose-200 shadow-xs space-y-2 transition";
                    inputEl.className = "w-full py-2.5 pl-3 pr-10 border border-rose-400 bg-white rounded-lg text-rose-900 font-medium text-base outline-none";
                    feedbackEl.className = "text-xs pl-9 pt-1 font-semibold text-rose-600 flex items-center gap-1";
                    feedbackEl.innerHTML = `<i data-lucide="x" class="w-4 h-4"></i> Incorrect. Correct spelling: <span class="underline font-bold">${escapeHtml(target)}</span>`;
                }
            });

            lucide.createIcons();
            showResultsSummary(correctCount, targetWords.length);
        }

        /**
         * Render final score summary card
         */
        function showResultsSummary(score, total) {
            const resultsCard = document.getElementById('results-card');
            const scoreIcon = document.getElementById('score-icon');
            const scoreTitle = document.getElementById('score-title');
            const scoreText = document.getElementById('score-text');
            const retryMistakesBtn = document.getElementById('retry-mistakes-btn');

            const percentage = Math.round((score / total) * 100);

            if (percentage === 100) {
                scoreIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center bg-emerald-100 text-emerald-600";
                scoreIcon.innerHTML = `<i data-lucide="award" class="w-8 h-8"></i>`;
                scoreTitle.textContent = "Perfect Score!";
                retryMistakesBtn.classList.add('hidden');
            } else if (percentage >= 70) {
                scoreIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center bg-indigo-100 text-indigo-600";
                scoreIcon.innerHTML = `<i data-lucide="thumbs-up" class="w-8 h-8"></i>`;
                scoreTitle.textContent = "Great Job!";
                retryMistakesBtn.classList.remove('hidden');
            } else {
                scoreIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center bg-amber-100 text-amber-600";
                scoreIcon.innerHTML = `<i data-lucide="book-open" class="w-8 h-8"></i>`;
                scoreTitle.textContent = "Keep Practicing!";
                retryMistakesBtn.classList.remove('hidden');
            }

            scoreText.textContent = `You spelled ${score} out of ${total} words correctly (${percentage}%).`;
            resultsCard.classList.remove('hidden');

            lucide.createIcons();
            resultsCard.scrollIntoView({ behavior: 'smooth' });
        }

        function retryMistakesOnly() {
            if (wrongWords.length === 0) return;
            targetWords = [...wrongWords];
            document.getElementById('results-card').classList.add('hidden');
            renderPracticeFields();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retrySameWords() {
            document.getElementById('results-card').classList.add('hidden');
            renderPracticeFields();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetApp() {
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('practice-section').classList.add('hidden');
            document.getElementById('results-card').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function escapeJsString(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
